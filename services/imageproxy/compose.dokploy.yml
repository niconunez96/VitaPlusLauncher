services:
  imageproxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      IMAGE_PROXY_ADDR: ":8090"
    expose:
      - "8090"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vitashelflauncher-imageproxy.rule=Host(`${IMAGE_PROXY_DOMAIN}`)"
      - "traefik.http.routers.vitashelflauncher-imageproxy.entrypoints=websecure"
      - "traefik.http.routers.vitashelflauncher-imageproxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.vitashelflauncher-imageproxy.loadbalancer.server.port=8090"

networks:
  dokploy-network:
    external: true
